---
# ============================================================
# AWS SECRETS CONFIG PROVIDER (ASCP) - UNINSTALL
# ============================================================

- name: Uninstall AWS Secrets Config Provider Helm release
  ansible.builtin.command:
    cmd: >-
      helm uninstall secrets-provider-aws
      -n kube-system
  register: ascp_uninstall
  failed_when: false
  changed_when: ascp_uninstall.rc == 0

- name: Verify ASCP pods are removed
  ansible.builtin.command:
    cmd: >-
      kubectl get pods
      -n kube-system
      -l app.kubernetes.io/name=secrets-store-csi-driver-provider-aws
  register: ascp_pods_check
  failed_when: false
  changed_when: false

- name: Display ASCP removal status
  ansible.builtin.debug:
    msg: >-
      ASCP Helm release removal completed.
      Pod check return code: {{ ascp_pods_check.rc }}
