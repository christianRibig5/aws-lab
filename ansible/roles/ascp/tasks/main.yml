---
# ============================================================
# AWS SECRETS CONFIG PROVIDER (ASCP)
# ============================================================

- name: Verify Secrets Store CSI Driver is installed
  ansible.builtin.command:
    cmd: helm status csi-secrets-store -n kube-system
  changed_when: false

- name: Add AWS Secrets Provider Helm repository
  ansible.builtin.command:
    cmd: >-
      helm repo add aws-secrets-manager
      https://aws.github.io/secrets-store-csi-driver-provider-aws
      --force-update
  changed_when: false

- name: Update Helm repositories
  ansible.builtin.command:
    cmd: helm repo update
  changed_when: false

- name: Install or upgrade ASCP
  ansible.builtin.command:
    cmd: >-
      helm upgrade --install secrets-provider-aws
      aws-secrets-manager/secrets-store-csi-driver-provider-aws
      --namespace kube-system
      --set secrets-store-csi-driver.install=false
      --wait
      --timeout 5m
  register: ascp_install

- name: Verify ASCP pods
  ansible.builtin.command:
    cmd: kubectl get pods -n kube-system
  register: ascp_pods
  changed_when: false

- name: Display ASCP pods
  ansible.builtin.debug:
    var: ascp_pods.stdout_lines
