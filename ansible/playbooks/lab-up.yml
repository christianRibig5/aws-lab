---
# ============================================================
# AWS LAB - LAB UP
# ============================================================
#
# Purpose:
# Bring the reusable AWS lab infrastructure online in
# dependency order.
#
# This playbook is the LAB ON switch.
#
# Usage:
#
#   ansible-playbook playbooks/lab-up.yml
#
# Behaviour:
#
#   1. Validate AWS authentication.
#   2. Offer AWS SSO login if authentication has expired.
#   3. Check whether the EKS cluster already exists.
#   4. If EKS is ACTIVE:
#        - report that the lab is already up
#        - make no infrastructure changes
#        - exit successfully
#   5. If EKS does not exist:
#        - request LAB-UP confirmation
#        - apply infrastructure in dependency order
#   6. If EKS exists but is not ACTIVE:
#        - stop safely
#
# Bootstrap is intentionally excluded because the Terraform
# state bucket is persistent infrastructure.
#
# Deployment order:
#
#   AWS Authentication
#        ->
#   Lab State Check
#        ->
#   VPC
#        ->
#   EKS
#        ->
#   kubectl configuration
#        ->
#   EKS Pod Identity Agent
#        ->
#   EBS CSI Driver
#        ->
#   Secrets Store CSI Driver
#        ->
#   AWS Secrets Config Provider (ASCP)
#        ->
#   AWS Load Balancer Controller IAM / Pod Identity
#        ->
#   AWS Load Balancer Controller Helm
#
# ============================================================

- name: AWS Lab - Bring Up
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  tasks:
    # ========================================================
    # 0A. AWS AUTHENTICATION
    #
    # Terraform requires valid AWS credentials before
    # terraform init can access the S3 remote backend.
    # ========================================================

    - name: Check AWS authentication
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: aws_auth_check
      changed_when: false
      failed_when: false

    # --------------------------------------------------------
    # Existing AWS session is valid
    # --------------------------------------------------------

    - name: Report active AWS session
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS AUTHENTICATION OK"
          - "============================================================"
          - "Profile: {{ aws_profile }}"
          - "Region:  {{ aws_region }}"
          - "AWS credentials are active."
          - "Continuing with lab-up."
          - "============================================================"
      when: aws_auth_check.rc == 0

    # --------------------------------------------------------
    # Existing AWS session is invalid / expired
    # --------------------------------------------------------

    - name: Report expired AWS session
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS AUTHENTICATION REQUIRED"
          - "============================================================"
          - "Profile: {{ aws_profile }}"
          - "Region:  {{ aws_region }}"
          - ""
          - "The AWS session is expired or unavailable."
          - "AWS SSO authentication is required before Terraform."
          - "============================================================"
      when: aws_auth_check.rc != 0

    # --------------------------------------------------------
    # Ask permission before launching AWS SSO.
    # --------------------------------------------------------

    - name: Ask to authenticate with AWS SSO
      ansible.builtin.pause:
        prompt: |

          ============================================================
          AWS SSO LOGIN REQUIRED
          ============================================================

          AWS authentication is not currently valid.

          Ansible can run:

            aws sso login --profile {{ aws_profile }}

          This may open your browser for AWS authentication.

          Type LOGIN to authenticate now.
          Press Enter to cancel lab-up.

      register: aws_sso_confirmation
      when: aws_auth_check.rc != 0

    # --------------------------------------------------------
    # Cancel safely when SSO login is not approved.
    # --------------------------------------------------------

    - name: Stop when AWS SSO login is declined
      ansible.builtin.fail:
        msg: |

          ============================================================
          LAB-UP CANCELLED
          ============================================================

          AWS authentication is required.

          Authenticate manually with:

            aws sso login --profile {{ aws_profile }}

          Then run:

            ansible-playbook playbooks/lab-up.yml

          No lab infrastructure changes were made.
          ============================================================

      when:
        - aws_auth_check.rc != 0
        - aws_sso_confirmation.user_input | default('') != "LOGIN"

    # --------------------------------------------------------
    # Perform AWS SSO authentication.
    # --------------------------------------------------------

    - name: Login to AWS SSO
      ansible.builtin.command:
        argv:
          - aws
          - sso
          - login
          - --profile
          - "{{ aws_profile }}"
      register: aws_sso_login
      changed_when: false
      when:
        - aws_auth_check.rc != 0
        - aws_sso_confirmation.user_input | default('') == "LOGIN"

    # --------------------------------------------------------
    # Verify authentication again after SSO login.
    # --------------------------------------------------------

    - name: Verify AWS authentication after SSO login
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: aws_auth_recheck
      changed_when: false
      failed_when: false
      when: aws_auth_check.rc != 0

    # --------------------------------------------------------
    # Terraform must never start unless AWS authentication
    # has been successfully verified.
    # --------------------------------------------------------

    - name: Validate AWS authentication
      ansible.builtin.assert:
        that:
          - >
            aws_auth_check.rc == 0 or
            (
              aws_auth_recheck is defined and
              aws_auth_recheck.rc is defined and
              aws_auth_recheck.rc == 0
            )
        fail_msg: |

          ============================================================
          AWS AUTHENTICATION FAILED
          ============================================================

          AWS authentication could not be verified.

          Run:

            aws sso login --profile {{ aws_profile }}

          Then verify:

            aws sts get-caller-identity \
              --profile {{ aws_profile }} \
              --region {{ aws_region }}

          Terraform has NOT been started.
          ============================================================

        success_msg: >-
          AWS authentication verified successfully.
          Checking current lab state.

    # ========================================================
    # 0B. LAB STATE CHECK
    #
    # EKS is used as the primary indicator that the reusable
    # AWS lab is currently online.
    #
    # ACTIVE:
    #   Lab is already running.
    #   Exit successfully without Terraform or Helm.
    #
    # NOT FOUND:
    #   Lab is down.
    #   Continue with normal lab startup.
    #
    # OTHER STATUS:
    #   Cluster is transitioning.
    #   Stop safely.
    # ========================================================

    - name: Check whether EKS cluster already exists
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-cluster
          - --name
          - "{{ eks_cluster_name }}"
          - --region
          - "{{ aws_region }}"
          - --profile
          - "{{ aws_profile }}"
          - --query
          - "cluster.status"
          - --output
          - text
      register: eks_lab_status
      changed_when: false
      failed_when: false

    # --------------------------------------------------------
    # Display detected lab state.
    # --------------------------------------------------------

    - name: Display current AWS lab state
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS LAB STATE CHECK"
          - "============================================================"
          - "EKS cluster: {{ eks_cluster_name }}"
          - >-
            Status: {{
              eks_lab_status.stdout | trim
              if eks_lab_status.rc == 0
              else 'NOT FOUND'
            }}
          - "============================================================"

    # --------------------------------------------------------
    # Protect against transitional EKS states.
    #
    # Do not run Terraform while an existing cluster is
    # creating, updating or deleting.
    # --------------------------------------------------------

    - name: Stop when EKS is in a transitional state
      ansible.builtin.fail:
        msg: |

          ============================================================
          AWS LAB IS IN A TRANSITIONAL STATE
          ============================================================

          EKS cluster: {{ eks_cluster_name }}
          Status:      {{ eks_lab_status.stdout | trim }}

          The EKS cluster exists but is not ACTIVE.

          Lab-up will not continue while the cluster is
          transitioning.

          Check again with:

            aws eks describe-cluster \
              --name {{ eks_cluster_name }} \
              --region {{ aws_region }} \
              --profile {{ aws_profile }} \
              --query 'cluster.status' \
              --output text

          Wait until the current AWS operation has completed
          before running lab-up again.

          ============================================================

      when:
        - eks_lab_status.rc == 0
        - eks_lab_status.stdout | trim != "ACTIVE"

    # --------------------------------------------------------
    # Existing ACTIVE EKS cluster means the core lab is
    # already online.
    # --------------------------------------------------------

    - name: Report lab is already up
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS LAB IS ALREADY UP"
          - "============================================================"
          - "EKS cluster: {{ eks_cluster_name }}"
          - "Status:      ACTIVE"
          - ""
          - "No Terraform or Helm operations are required."
          - "No infrastructure changes will be made."
          - ""
          - "You can proceed with project-up."
          - "============================================================"

      when:
        - eks_lab_status.rc == 0
        - eks_lab_status.stdout | trim == "ACTIVE"

    # --------------------------------------------------------
    # End successfully.
    #
    # This is not an error. The desired state (LAB ON)
    # has already been achieved.
    # --------------------------------------------------------

    - name: Stop lab-up because lab is already running
      ansible.builtin.meta: end_play
      when:
        - eks_lab_status.rc == 0
        - eks_lab_status.stdout | trim == "ACTIVE"

    # ========================================================
    # 0C. LAB-UP CONFIRMATION
    #
    # Reaching this point means an ACTIVE EKS cluster was not
    # found and the lab needs to be brought online.
    # ========================================================

    - name: Confirm AWS lab startup
      ansible.builtin.pause:
        prompt: |

          ============================================================
          AWS LAB - STARTUP CONFIRMATION
          ============================================================

          The reusable AWS lab is currently DOWN.

          This will bring the AWS lab online.

          Deployment order:

            VPC
              ->
            EKS
              ->
            EKS Pod Identity Agent
              ->
            EBS CSI Driver
              ->
            Secrets Store CSI Driver
              ->
            AWS Secrets Config Provider
              ->
            AWS Load Balancer Controller

          Chargeable AWS resources may be created.

          Type LAB-UP to continue.
          Press Enter to cancel.

      register: lab_up_confirmation

    # --------------------------------------------------------
    # Cancel safely unless explicitly confirmed.
    # --------------------------------------------------------

    - name: Stop unless lab startup is confirmed
      ansible.builtin.fail:
        msg: |

          ============================================================
          LAB-UP CANCELLED
          ============================================================

          No Terraform infrastructure changes were started.
          ============================================================

      when: lab_up_confirmation.user_input != "LAB-UP"

    # ========================================================
    # 1. VPC
    #
    # VPC must be applied first because EKS consumes the VPC
    # Terraform remote-state outputs.
    # ========================================================

    - name: Terraform - VPC
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.vpc }}"
        terraform_action: apply
        terraform_auto_approve: true

    # ========================================================
    # 2. EKS
    #
    # EKS consumes VPC ID and subnet IDs from the VPC
    # Terraform remote state.
    # ========================================================

    - name: Terraform - EKS
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.eks }}"
        terraform_action: apply
        terraform_auto_approve: true

    # ========================================================
    # 3. CONFIGURE KUBECTL
    #
    # EKS must exist before kubeconfig can be configured.
    # ========================================================

    - name: Configure kubectl for EKS
      ansible.builtin.include_role:
        name: eks_kubeconfig

    # ========================================================
    # 4. EKS POD IDENTITY AGENT
    # ========================================================

    - name: Terraform - EKS Pod Identity Agent
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.pod_identity }}"
        terraform_action: apply
        terraform_auto_approve: true

    # ========================================================
    # 5. EBS CSI DRIVER
    #
    # Terraform manages the AWS/IAM/Pod Identity portion
    # according to the existing lab architecture.
    # ========================================================

    - name: Terraform - EBS CSI Driver
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.ebs }}"
        terraform_action: apply
        terraform_auto_approve: true

    # ========================================================
    # 6. SECRETS STORE CSI DRIVER - HELM
    # ========================================================

    - name: Install Secrets Store CSI Driver
      ansible.builtin.include_role:
        name: secrets_store_csi

    # ========================================================
    # 7. AWS SECRETS CONFIG PROVIDER (ASCP) - HELM
    # ========================================================

    - name: Install AWS Secrets Config Provider
      ansible.builtin.include_role:
        name: ascp

    # ========================================================
    # 8. AWS LOAD BALANCER CONTROLLER
    #    IAM + POD IDENTITY
    # ========================================================

    - name: Terraform - AWS Load Balancer Controller
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.aws_load_balancer_controller }}"
        terraform_action: apply
        terraform_auto_approve: true

    # ========================================================
    # 9. AWS LOAD BALANCER CONTROLLER - HELM
    # ========================================================

    - name: Install AWS Load Balancer Controller
      ansible.builtin.include_role:
        name: aws_load_balancer_controller
        apply:
          tags:
            - alb_controller
      tags:
        - alb_controller

    # ========================================================
    # 10. FINAL STATUS
    # ========================================================

    - name: Display successful lab startup
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS LAB IS UP"
          - "============================================================"
          - "AWS authentication:              OK"
          - "VPC:                             APPLIED"
          - "EKS:                             APPLIED"
          - "kubectl:                         CONFIGURED"
          - "EKS Pod Identity Agent:          APPLIED"
          - "EBS CSI Driver:                  APPLIED"
          - "Secrets Store CSI Driver:        INSTALLED"
          - "AWS Secrets Config Provider:     INSTALLED"
          - "AWS Load Balancer Controller:    INSTALLED"
          - ""
          - "Shared AWS lab is ready for project workloads."
          - ""
          - "Next:"
          - "Run project-up from the project repository."
          - "============================================================"
