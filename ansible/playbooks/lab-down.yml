---
# ============================================================
# AWS LAB - COMPLETE DESTRUCTION
# ============================================================
#
# Purpose:
# Safely destroy the reusable AWS lab while respecting
# Kubernetes, EKS and AWS dependency ordering.
#
# This playbook is designed to be rerunnable.
#
# High-level destruction order:
#
#   AWS Authentication
#        ↓
#   Discover current lab state
#        ↓
#   Kubernetes / Load Balancer cleanup
#        ↓
#   AWS Load Balancer Controller
#        ↓
#   Secrets Store / ASCP
#        ↓
#   EBS CSI
#        ↓
#   Pod Identity Agent
#        ↓
#   EKS
#        ↓
#   Wait for NON-NAT AWS-managed ENIs
#        ↓
#   Clean orphaned Kubernetes security groups
#        ↓
#   Validate unexpected VPC dependencies
#        ↓
#   Terraform VPC destroy
#        ↓
#   NAT Gateway / NAT ENI / EIP / routes / subnets / IGW
#        ↓
#   Final cleanup verification
#
# IMPORTANT:
#
# NAT Gateway ENIs are intentionally NOT treated as blockers
# before VPC Terraform destruction.
#
# The NAT Gateway belongs to the Terraform VPC component.
# Terraform must be allowed to destroy it. AWS will then
# remove the requester-managed NAT Gateway ENI.
#
# Bootstrap / Terraform state infrastructure remains.
# ============================================================

- name: AWS Lab - Complete Destruction
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../group_vars/all.yml

  vars:
    destroy_confirmation_text: "DESTROY"

  tasks:
    # ========================================================
    # 0A. AWS AUTHENTICATION
    # ========================================================

    - name: Check AWS authentication
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: aws_auth_check
      changed_when: false
      failed_when: false

    - name: Report active AWS session
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS AUTHENTICATION OK"
          - "============================================================"
          - "Profile: {{ aws_profile }}"
          - "Region:  {{ aws_region }}"
          - "AWS credentials are active."
          - "============================================================"
      when: aws_auth_check.rc == 0

    - name: Report expired AWS session
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " AWS AUTHENTICATION REQUIRED"
          - "============================================================"
          - "Profile: {{ aws_profile }}"
          - "Region:  {{ aws_region }}"
          - ""
          - "The AWS session is expired or unavailable."
          - "AWS SSO authentication is required before lab-down."
          - "============================================================"
      when: aws_auth_check.rc != 0

    - name: Ask to authenticate with AWS SSO
      ansible.builtin.pause:
        prompt: |

          ============================================================
          AWS SSO LOGIN REQUIRED
          ============================================================

          AWS authentication is not currently valid.

          Ansible can run:

            aws sso login --profile {{ aws_profile }}

          Type LOGIN to authenticate now.
          Press Enter to cancel lab-down.

      register: aws_sso_confirmation
      when: aws_auth_check.rc != 0

    - name: Stop when AWS SSO login is declined
      ansible.builtin.fail:
        msg: |

          ============================================================
          LAB-DOWN CANCELLED
          ============================================================

          AWS authentication is required.

          Authenticate manually:

            aws sso login --profile {{ aws_profile }}

          Then rerun:

            ansible-playbook playbooks/lab-down.yml

          ============================================================
      when:
        - aws_auth_check.rc != 0
        - aws_sso_confirmation.user_input | default('') != "LOGIN"

    - name: Login to AWS SSO
      ansible.builtin.command:
        argv:
          - aws
          - sso
          - login
          - --profile
          - "{{ aws_profile }}"
      changed_when: false
      when:
        - aws_auth_check.rc != 0
        - aws_sso_confirmation.user_input | default('') == "LOGIN"

    - name: Verify AWS authentication after SSO login
      ansible.builtin.command:
        argv:
          - aws
          - sts
          - get-caller-identity
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: aws_auth_recheck
      changed_when: false
      failed_when: false
      when: aws_auth_check.rc != 0

    - name: Validate AWS authentication
      ansible.builtin.assert:
        that:
          - >
            aws_auth_check.rc == 0 or
            (
              aws_auth_recheck is defined and
              aws_auth_recheck.rc is defined and
              aws_auth_recheck.rc == 0
            )
        fail_msg: |

          ============================================================
          AWS AUTHENTICATION FAILED
          ============================================================

          Run:

            aws sso login --profile {{ aws_profile }}

          Terraform destruction has NOT started.

          ============================================================

        success_msg: "AWS authentication verified."

    # ========================================================
    # 0B. DISCOVER CURRENT LAB STATE
    # ========================================================

    - name: Check whether the EKS cluster exists
      ansible.builtin.command:
        argv:
          - aws
          - eks
          - describe-cluster
          - --name
          - "{{ eks_cluster_name }}"
          - --region
          - "{{ aws_region }}"
          - --profile
          - "{{ aws_profile }}"
          - --query
          - "cluster.status"
          - --output
          - text
      register: eks_check
      changed_when: false
      failed_when: false

    - name: Record EKS availability
      ansible.builtin.set_fact:
        eks_cluster_exists: "{{ eks_check.rc == 0 }}"

    - name: Read lab VPC ID from Terraform state
      ansible.builtin.command:
        argv:
          - terraform
          - output
          - -raw
          - vpc_id
      args:
        chdir: "{{ terraform_components.vpc }}"
      register: terraform_vpc_output
      changed_when: false
      failed_when: false

    - name: Record Terraform VPC information
      ansible.builtin.set_fact:
        terraform_has_vpc_id: >-
          {{
            terraform_vpc_output.rc == 0 and
            (terraform_vpc_output.stdout | trim | length > 0)
          }}

        lab_vpc_id: >-
          {{
            terraform_vpc_output.stdout | trim
            if (
              terraform_vpc_output.rc == 0 and
              terraform_vpc_output.stdout | trim | length > 0
            )
            else ''
          }}

    - name: Verify Terraform VPC ID exists in AWS
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-vpcs
          - --vpc-ids
          - "{{ lab_vpc_id }}"
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - "Vpcs[0].VpcId"
          - --output
          - text
      register: aws_vpc_check
      changed_when: false
      failed_when: false
      when: terraform_has_vpc_id | bool

    - name: Record actual AWS VPC availability
      ansible.builtin.set_fact:
        lab_vpc_exists: >-
          {{
            terraform_has_vpc_id | bool and
            aws_vpc_check is defined and
            aws_vpc_check.rc | default(1) == 0 and
            aws_vpc_check.stdout | default('') | trim == lab_vpc_id
          }}

    - name: Display infrastructure status
      ansible.builtin.debug:
        msg: |
          ============================================================
          AWS LAB CURRENT STATE
          ============================================================

          EKS exists:            {{ eks_cluster_exists }}
          Terraform has VPC ID: {{ terraform_has_vpc_id }}
          VPC ID:               {{ lab_vpc_id if terraform_has_vpc_id else 'N/A' }}
          VPC actually exists:  {{ lab_vpc_exists }}

          ============================================================

    - name: Report lab is already completely down
      ansible.builtin.debug:
        msg: |
          ============================================================
          ✅ AWS LAB IS ALREADY DOWN
          ============================================================

          EKS cluster does not exist.
          VPC does not exist.

          No destructive operations are required.

          ============================================================
      when:
        - not eks_cluster_exists | bool
        - not lab_vpc_exists | bool

    - name: Stop because lab is already down
      ansible.builtin.meta: end_play
      when:
        - not eks_cluster_exists | bool
        - not lab_vpc_exists | bool

    # ========================================================
    # 0C. CONFIRM DESTRUCTION
    # ========================================================

    - name: Confirm AWS lab destruction
      ansible.builtin.pause:
        prompt: |

          ============================================================
          AWS LAB - DESTRUCTION CONFIRMATION
          ============================================================

          WARNING:

          This will destroy the reusable AWS lab infrastructure.

          Destruction order:

            Kubernetes / Load Balancers
              ->
            AWS Load Balancer Controller
              ->
            Secrets Store CSI / ASCP
              ->
            EBS CSI
              ->
            Pod Identity Agent
              ->
            EKS
              ->
            AWS-managed network cleanup
              ->
            VPC

          Bootstrap / Terraform state will remain.

          Type {{ destroy_confirmation_text }} to continue.
          Press Enter to cancel.

      register: destroy_confirmation

    - name: Stop unless destruction is confirmed
      ansible.builtin.fail:
        msg: |
          ============================================================
          LAB-DOWN CANCELLED
          ============================================================

          No additional destructive operations were started.

          ============================================================
      when: destroy_confirmation.user_input != destroy_confirmation_text

    # ========================================================
    # 1. CONFIGURE KUBECTL
    # ========================================================

    - name: Configure kubectl for EKS
      ansible.builtin.include_role:
        name: eks_kubeconfig
      when: eks_cluster_exists | bool

    # ========================================================
    # 2. KUBERNETES INGRESS CLEANUP
    # ========================================================

    - name: Find Kubernetes ingresses
      ansible.builtin.command:
        argv:
          - kubectl
          - get
          - ingress
          - -A
          - -o
          - json
      register: kubernetes_ingresses
      changed_when: false
      failed_when: false
      when: eks_cluster_exists | bool

    - name: Record Kubernetes ingress resources
      ansible.builtin.set_fact:
        ingress_resources: >-
          {{
            (
              kubernetes_ingresses.stdout | default('{"items":[]}', true) | from_json
            ).items | default([])
          }}
      when: eks_cluster_exists | bool

    - name: Delete Kubernetes ingresses
      ansible.builtin.command:
        argv:
          - kubectl
          - delete
          - ingress
          - "{{ item.metadata.name }}"
          - -n
          - "{{ item.metadata.namespace }}"
          - --ignore-not-found=true
      loop: "{{ ingress_resources | default([]) }}"
      register: ingress_delete
      changed_when: true
      failed_when: false
      when:
        - eks_cluster_exists | bool
        - ingress_resources | default([]) | length > 0

    # ========================================================
    # 3. WAIT FOR AWS LOAD BALANCERS
    # ========================================================

    - name: Check AWS load balancers in lab VPC
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-load-balancers
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - "LoadBalancers[?VpcId=='{{ lab_vpc_id }}'].LoadBalancerArn"
          - --output
          - json
      register: lab_load_balancers
      changed_when: false
      failed_when: false
      when: lab_vpc_exists | bool

    - name: Wait for Kubernetes AWS load balancers to disappear
      ansible.builtin.command:
        argv:
          - aws
          - elbv2
          - describe-load-balancers
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --query
          - "LoadBalancers[?VpcId=='{{ lab_vpc_id }}'].LoadBalancerArn"
          - --output
          - json
      register: lb_wait
      changed_when: false
      retries: 30
      delay: 10
      until: >
        (lb_wait.stdout | default('[]', true) | from_json | length) == 0
      when:
        - lab_vpc_exists | bool
        - (lab_load_balancers.stdout | default('[]', true) | from_json | length) > 0

    # ========================================================
    # 4. AWS LOAD BALANCER CONTROLLER - HELM
    # ========================================================

    - name: Uninstall AWS Load Balancer Controller
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - aws-load-balancer-controller
          - -n
          - kube-system
      register: alb_controller_helm_delete
      changed_when: alb_controller_helm_delete.rc == 0
      failed_when: false
      when: eks_cluster_exists | bool

    # ========================================================
    # 5. AWS LOAD BALANCER CONTROLLER - TERRAFORM
    # ========================================================

    - name: Terraform Destroy - AWS Load Balancer Controller
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.aws_load_balancer_controller }}"
        terraform_action: "destroy"
        terraform_auto_approve: true
      when: eks_cluster_exists | bool

    # ========================================================
    # 6. ASCP
    # ========================================================

    - name: Uninstall AWS Secrets Config Provider
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - secrets-store-csi-driver-provider-aws
          - -n
          - kube-system
      register: ascp_delete
      changed_when: ascp_delete.rc == 0
      failed_when: false
      when: eks_cluster_exists | bool

    # ========================================================
    # 7. SECRETS STORE CSI DRIVER
    # ========================================================

    - name: Uninstall Secrets Store CSI Driver
      ansible.builtin.command:
        argv:
          - helm
          - uninstall
          - secrets-store-csi-driver
          - -n
          - kube-system
      register: secrets_store_delete
      changed_when: secrets_store_delete.rc == 0
      failed_when: false
      when: eks_cluster_exists | bool

    # ========================================================
    # 8. EBS CSI
    # ========================================================

    - name: Terraform Destroy - EBS CSI Driver
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.ebs }}"
        terraform_action: "destroy"
        terraform_auto_approve: true
      when: eks_cluster_exists | bool

    # ========================================================
    # 9. POD IDENTITY AGENT
    # ========================================================

    - name: Terraform Destroy - EKS Pod Identity Agent
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.pod_identity }}"
        terraform_action: "destroy"
        terraform_auto_approve: true
      when: eks_cluster_exists | bool

    # ========================================================
    # 10. EKS
    # ========================================================

    - name: Terraform Destroy - EKS
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.eks }}"
        terraform_action: "destroy"
        terraform_auto_approve: true
      when: eks_cluster_exists | bool

    # ========================================================
    # 11. WAIT FOR NON-NAT ENIs
    #
    # NAT Gateway ENIs are deliberately excluded because
    # Terraform owns the NAT Gateway.
    # ========================================================

    - name: Wait for non-NAT AWS-managed ENIs to disappear
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-network-interfaces
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "NetworkInterfaces[?InterfaceType!='nat_gateway'].NetworkInterfaceId"
          - --output
          - json
      register: eni_wait
      changed_when: false
      retries: 30
      delay: 10
      until: >
        (eni_wait.stdout | default('[]', true) | from_json | length) == 0
      when: lab_vpc_exists | bool

    # ========================================================
    # 12. NAT GATEWAY ENIs - INFORMATIONAL
    # ========================================================

    - name: Check Terraform-managed NAT Gateway ENIs
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-network-interfaces
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - "Name=interface-type,Values=nat_gateway"
          - --query
          - "NetworkInterfaces[].{ID:NetworkInterfaceId,Description:Description,Status:Status}"
          - --output
          - json
      register: nat_gateway_enis
      changed_when: false
      when: lab_vpc_exists | bool

    - name: Report Terraform-managed NAT Gateway ENIs
      ansible.builtin.debug:
        msg: |
          ============================================================
          NAT GATEWAY NETWORK INTERFACES
          ============================================================

          NAT Gateway ENIs still present:

          {{ nat_gateway_enis.stdout | default('[]', true) | from_json | to_nice_json }}

          This is expected.

          Terraform will destroy the NAT Gateway.
          AWS will then remove its requester-managed ENI.

          ============================================================
      when:
        - lab_vpc_exists | bool
        - (nat_gateway_enis.stdout | default('[]', true) | from_json | length) > 0

    # ========================================================
    # 13. ORPHANED KUBERNETES SECURITY GROUPS
    # ========================================================

    - name: Find orphaned Kubernetes load balancer security groups
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-security-groups
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "SecurityGroups[?GroupName!='default' && contains(Description, '[k8s]')].GroupId"
          - --output
          - json
      register: k8s_security_groups
      changed_when: false
      when: lab_vpc_exists | bool

    - name: Record orphaned Kubernetes security groups
      ansible.builtin.set_fact:
        k8s_security_group_ids: >-
          {{
            k8s_security_groups.stdout | default('[]', true) | from_json
          }}
      when: lab_vpc_exists | bool

    - name: Delete orphaned Kubernetes load balancer security groups
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - delete-security-group
          - --group-id
          - "{{ item }}"
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
      loop: "{{ k8s_security_group_ids | default([]) }}"
      register: k8s_sg_delete
      changed_when: k8s_sg_delete.rc == 0
      failed_when: false
      when:
        - lab_vpc_exists | bool
        - k8s_security_group_ids | default([]) | length > 0

    - name: Wait for orphaned Kubernetes security groups to disappear
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-security-groups
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "SecurityGroups[?GroupName!='default' && contains(Description, '[k8s]')].GroupId"
          - --output
          - json
      register: k8s_sg_wait
      changed_when: false
      retries: 12
      delay: 5
      until: >
        (k8s_sg_wait.stdout | default('[]', true) | from_json | length) == 0
      when:
        - lab_vpc_exists | bool
        - k8s_security_group_ids | default([]) | length > 0

    # ========================================================
    # 14. PRE-VPC VALIDATION
    #
    # Only unexpected resources block Terraform.
    #
    # Terraform-owned resources allowed to remain:
    #
    #   NAT Gateway
    #   NAT Gateway ENI
    #   EIP
    #   route tables
    #   subnets
    #   Internet Gateway
    # ========================================================

    - name: Check unexpected non-NAT ENIs
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-network-interfaces
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "NetworkInterfaces[?InterfaceType!='nat_gateway'].{ID:NetworkInterfaceId,Type:InterfaceType,Description:Description,Status:Status}"
          - --output
          - json
      register: final_non_nat_enis
      changed_when: false
      when: lab_vpc_exists | bool

    - name: Check unexpected non-default security groups
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-security-groups
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "SecurityGroups[?GroupName!='default'].{ID:GroupId,Name:GroupName,Description:Description}"
          - --output
          - json
      register: final_security_groups
      changed_when: false
      when: lab_vpc_exists | bool

    - name: Check unexpected VPC endpoints
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-vpc-endpoints
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "VpcEndpoints[].{ID:VpcEndpointId,Service:ServiceName,State:State}"
          - --output
          - json
      register: final_vpc_endpoints
      changed_when: false
      when: lab_vpc_exists | bool

    # ========================================================
    # 15. TERRAFORM-OWNED RESOURCES - INFORMATIONAL
    # ========================================================

    - name: Check NAT gateways awaiting Terraform destruction
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-nat-gateways
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filter
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "NatGateways[?State!='deleted'].{ID:NatGatewayId,State:State,SubnetId:SubnetId}"
          - --output
          - json
      register: terraform_nat_gateways
      changed_when: false
      when: lab_vpc_exists | bool

    - name: Check route tables awaiting Terraform destruction
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-route-tables
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --filters
          - "Name=vpc-id,Values={{ lab_vpc_id }}"
          - --query
          - "RouteTables[?length(Associations[?Main==`true`]) == `0`].RouteTableId"
          - --output
          - json
      register: terraform_route_tables
      changed_when: false
      when: lab_vpc_exists | bool

    # ========================================================
    # 16. RECORD PRE-VPC VALIDATION
    # ========================================================

    - name: Record pre-VPC validation results
      ansible.builtin.set_fact:
        blocking_eni_list: >-
          {{
            final_non_nat_enis.stdout | default('[]', true) | from_json
          }}

        blocking_sg_list: >-
          {{
            final_security_groups.stdout | default('[]', true) | from_json
          }}

        blocking_endpoint_list: >-
          {{
            final_vpc_endpoints.stdout | default('[]', true) | from_json
          }}

        expected_nat_list: >-
          {{
            terraform_nat_gateways.stdout | default('[]', true) | from_json
          }}

        expected_route_table_list: >-
          {{
            terraform_route_tables.stdout | default('[]', true) | from_json
          }}
      when: lab_vpc_exists | bool

    # ========================================================
    # 17. STOP ONLY FOR UNEXPECTED DEPENDENCIES
    # ========================================================

    - name: Stop if unexpected VPC dependencies remain
      ansible.builtin.fail:
        msg: |

          ============================================================
          ❌ VPC DESTRUCTION BLOCKED
          ============================================================

          Unexpected AWS resources still depend on:

            {{ lab_vpc_id }}

          ------------------------------------------------------------
          Unexpected non-NAT ENIs
          ------------------------------------------------------------

          {{ blocking_eni_list | to_nice_json }}

          ------------------------------------------------------------
          Unexpected non-default Security Groups
          ------------------------------------------------------------

          {{ blocking_sg_list | to_nice_json }}

          ------------------------------------------------------------
          Unexpected VPC Endpoints
          ------------------------------------------------------------

          {{ blocking_endpoint_list | to_nice_json }}

          Terraform VPC destruction has NOT been started.

          NAT Gateways, NAT Gateway ENIs, route tables,
          subnets, EIPs and the Internet Gateway are not
          blockers because they belong to the Terraform
          VPC component.

          ============================================================

      when:
        - lab_vpc_exists | bool
        - >
          (blocking_eni_list | length > 0) or
          (blocking_sg_list | length > 0) or
          (blocking_endpoint_list | length > 0)

    # ========================================================
    # 18. PRE-VPC VALIDATION PASSED
    # ========================================================

    - name: Confirm VPC dependency validation passed
      ansible.builtin.debug:
        msg: |

          ============================================================
          ✅ VPC PRE-DESTRUCTION VALIDATION PASSED
          ============================================================

          No unexpected blocking resources remain.

          Cleared:

            - EKS / ELB non-NAT ENIs
            - Kubernetes load balancers
            - Kubernetes orphan security groups
            - Unexpected VPC endpoints

          ------------------------------------------------------------
          Terraform-owned NAT Gateways
          ------------------------------------------------------------

          {{ expected_nat_list | to_nice_json }}

          ------------------------------------------------------------
          Terraform-owned non-main route tables
          ------------------------------------------------------------

          {{ expected_route_table_list | to_nice_json }}

          These resources are expected.

          Terraform will now destroy the VPC component and
          its remaining network resources.

          ============================================================

      when: lab_vpc_exists | bool

    # ========================================================
    # 19. TERRAFORM DESTROY - VPC
    #
    # Terraform owns:
    #
    #   NAT Gateway
    #        ↓
    #   NAT Gateway ENI
    #        ↓
    #   Elastic IP
    #        ↓
    #   Route tables
    #        ↓
    #   Subnets
    #        ↓
    #   Internet Gateway
    #        ↓
    #   VPC
    # ========================================================

    - name: Terraform Destroy - VPC
      ansible.builtin.include_role:
        name: terraform
      vars:
        terraform_working_dir: "{{ terraform_components.vpc }}"
        terraform_action: "destroy"
        terraform_auto_approve: true
      when: lab_vpc_exists | bool

    # ========================================================
    # 20. VERIFY VPC REMOVAL
    # ========================================================

    - name: Verify VPC no longer exists
      ansible.builtin.command:
        argv:
          - aws
          - ec2
          - describe-vpcs
          - --vpc-ids
          - "{{ lab_vpc_id }}"
          - --profile
          - "{{ aws_profile }}"
          - --region
          - "{{ aws_region }}"
          - --output
          - json
      register: final_vpc_check
      changed_when: false
      failed_when: false
      when: lab_vpc_exists | bool

    - name: Validate VPC destruction
      ansible.builtin.assert:
        that:
          - final_vpc_check.rc != 0
        fail_msg: |

          ============================================================
          ❌ VPC STILL EXISTS
          ============================================================

          VPC:

            {{ lab_vpc_id }}

          Terraform completed but AWS still reports the VPC.

          Inspect remaining dependencies before manually
          deleting AWS resources.

          ============================================================

        success_msg: "VPC destruction verified successfully."
      when: lab_vpc_exists | bool

    # ========================================================
    # 21. SUCCESS
    # ========================================================

    - name: Display successful lab destruction
      ansible.builtin.debug:
        msg:
          - "============================================================"
          - " ✅ AWS LAB DESTRUCTION COMPLETED"
          - "============================================================"
          - "EKS:                             DESTROYED"
          - "AWS Load Balancer Controller:    DESTROYED"
          - "EBS CSI infrastructure:          DESTROYED"
          - "Pod Identity Agent:              DESTROYED"
          - "Secrets Store CSI / ASCP:        REMOVED"
          - "AWS-managed non-NAT ENIs:        CLEARED"
          - "NAT Gateway:                     DESTROYED BY TERRAFORM"
          - "NAT Gateway ENI:                 CLEARED BY AWS"
          - "VPC:                             DESTROYED"
          - ""
          - "Bootstrap / Terraform state remains persistent."
          - ""
          - "The reusable AWS lab is OFF."
          - "============================================================"

  # ==========================================================
  # POST-TASKS
  # ==========================================================

  post_tasks:
    - name: Check whether cleanup verification script exists
      ansible.builtin.stat:
        path: "{{ cleanup_check_script }}"
      register: cleanup_script
      when: cleanup_check_script is defined

    - name: Run final AWS cleanup verification
      ansible.builtin.command:
        argv:
          - "{{ cleanup_check_script }}"
      register: cleanup_check
      changed_when: false
      failed_when: false
      when:
        - cleanup_check_script is defined
        - cleanup_script.stat.exists | default(false)

    - name: Display final cleanup verification
      ansible.builtin.debug:
        msg: |

          ============================================================
          FINAL AWS CLEANUP VERIFICATION
          ============================================================

          {{ cleanup_check.stdout | default('Cleanup verification script not configured.') }}

          ============================================================

      when:
        - cleanup_check_script is defined
        - cleanup_script.stat.exists | default(false)
